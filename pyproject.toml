[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ovb-dnn"
version = "1.0.0"
description = "Control variables for deep neural networks: refit the last layer as an additive model in the learned features and a control variable"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Manuel Pfeuffer", email = "manuel.pfeuffer@hu-berlin.de" },
    { name = "Roshan P. Rane" },
    { name = "Kerstin Ritter" },
    { name = "Sonja Greven" },
]
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Paper = "https://arxiv.org/abs/2608.25930"
Repository = "https://github.com/mpff/ovb-dnn"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ovb_dnn*"]
